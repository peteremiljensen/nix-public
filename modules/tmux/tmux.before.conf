set-option -g default-terminal "tmux-256color"
set -as terminal-features "*256color:RGB"

set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"
set -as terminal-features 'wezterm*:extkeys'

# options
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

set -g detach-on-destroy off

set-window-option -g aggressive-resize on


# must not be enabled as it conflicts with sesh
# set -g destroy-unattached on

set -g @tmux-dotbar-position top
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-rounded true

set -g @tmux-dotbar-ssh-icon '󰌘'
set -g @tmux-dotbar-ssh-icon-only false
set -g @tmux-dotbar-ssh-enabled true

set -g @tmux-dotbar-bg "#1f1f28"
set -g @tmux-dotbar-fg "#9e9b93"
set -g @tmux-dotbar-fg-current "#dcd7ba"
set -g @tmux-dotbar-fg-session "#9e9b93"
set -g @tmux-dotbar-fg-prefix "#dcd7ba"

# colors
set-option -g pane-active-border-style "fg=#dcd7ba"
# set-option -g pane-border-lines "heavy"
set-option -g pane-border-style "fg=#9e9b93"

# keys
bind c new-window -a -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind x kill-pane

unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer

# needed by wezterm
set -g allow-passthrough on

# sesh
bind-key "Space" run "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind -N "last-session (via sesh) " L run-shell "sesh last"

# sessionx
# set -g @sessionx-bind 'o'
# set -g @sessionx-zoxide-mode 'on'


# vim navigator
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


# super fingers
set -g @super-fingers-key f

# tpad
# # Simple scratchpad
set -g @tpad-scratchpad-bind   "C-p"
set -g @tpad-scratchpad-opts   "status on"
set -g @tpad-scratchpad-dir    "#{pane_current_path}"

# Git management with lazygit (separate session per git repo)
set -g @tpad-git-bind          "C-g"
set -g @tpad-git-cmd           "lazygit"
set -g @tpad-git-per-dir       "true"
set -g @tpad-git-style         "fg=yellow"

# Notes with Neovim
set -g @tpad-notes-bind        "C-n"
set -g @tpad-notes-dir         "${NOTES_DIR}"
set -g @tpad-notes-cmd         "nvim -c NvimTreeOpen"
set -g @tpad-notes-prefix      "None"
set -g @tpad-notes-width       "80%"
set -g @tpad-notes-height      "80%"

# Task management
set -g @tpad-tasks-bind        "C-t"
set -g @tpad-tasks-style       "fg=green"
set -g @tpad-tasks-height      "40%"
set -g @tpad-tasks-width       "40%"
set -g @tpad-tasks-pos_x       "right"
set -g @tpad-tasks-pos_y       "bottom"
set -g @tpad-tasks-cmd         "taskwarrior-tui"
